<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استديو تنفيذ شيلات ليالي الأنس للإنتاج الفني</title>
    <style>
        :root {
            --bg: #090a0d;
            --panel: #12151f;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text: #ffffff;
            --muted: #a0a0a0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Tahoma', 'Cairo', sans-serif;
            line-height: 1.6;
        }
        header {
            background-color: var(--panel);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: bold;
        }
        nav a {
            color: var(--muted);
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
        }
        nav a:hover, nav a.active {
            color: var(--gold-light);
        }
        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 2rem;
        }
        .hero {
            text-align: center;
            padding: 4rem 1rem;
            background: linear-gradient(135deg, var(--panel), var(--bg));
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-top: 2rem;
        }
        .hero h1 {
            color: var(--gold-light);
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .hero p {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .btn {
            background: linear-gradient(135deg, var(--gold), #997420);
            color: #000;
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ليالي الأنس للإنتاج الفني</div>
        <nav>
            <a href="#" class="active">الرئيسية</a>
            <a href="#">الخدمات والأعمال</a>
            <a href="#">تواصل معنا</a>
        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <h1>صناعة أجمل الشيلات والزفات الاحترافية</h1>
            <p>نحوّل مناسباتكم إلى تحف فنية خالدة بأصوات مميزة وهندسة صوتية عالية الدقة.</p>
            <a href="#" class="btn">اطلب عملك الخاص الآن</a>
        </section>
    </div>

</body>
</html>
